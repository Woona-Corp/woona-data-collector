name: Promote exact server image

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main producer run ID (first attempt only)
        required: true
        type: string
      artifact_id:
        description: Exact server-verified-image artifact ID from that run
        required: true
        type: string
      source:
        description: Owner-reviewed full 40-character producer source commit
        required: true
        type: string
      apply:
        description: Apply replacement (false is read-only preflight)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: server-production-promotion
  cancel-in-progress: false
  queue: max

jobs:
  promote:
    if: >-
      github.repository == 'Woona-Corp/woona-data-collector' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Owner must require reviewers and restrict this environment to main.
    # Both preflight and apply use the same protected, reviewed baseline plan.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Hermetic promotion policy tests
        run: |
          pending='{"status":"incomplete","production_state":"not-assumed"}'
          printf '%s\n' "$pending" \
            > "$RUNNER_TEMP/server-promotion-evidence.json"
          python3 -B -m unittest discover -s shared/tools \
            -p 'test_promote_server.py' -v
      - name: Download exact code-image artifact (never build)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          SOURCE: ${{ inputs.source }}
        run: |
          python3 -B - "$RUN_ID" "$ARTIFACT_ID" "$SOURCE" <<'PY'
          import sys
          sys.path.insert(0, 'shared/tools')
          from promote_server import trusted_metadata
          run_id, artifact_id = map(int, sys.argv[1:3])
          assert run_id > 0 and artifact_id > 0
          trusted_metadata(run_id, artifact_id, sys.argv[3])
          PY
          endpoint="repos/Woona-Corp/woona-data-collector/actions/artifacts"
          gh api "$endpoint/$ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/server-artifact.zip"
      - name: Preflight or explicitly approved apply
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          SOURCE: ${{ inputs.source }}
          APPLY: ${{ inputs.apply }}
          SERVER_PROMOTION_PLAN: ${{ secrets.SERVER_PROMOTION_PLAN }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          export SERVER_SSH_KEY_FILE="$RUNNER_TEMP/server-ssh-key"
          export SERVER_KNOWN_HOSTS_FILE="$RUNNER_TEMP/server-known-hosts"
          printf '%s\n' "$SERVER_SSH_KEY" > "$SERVER_SSH_KEY_FILE"
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > "$SERVER_KNOWN_HOSTS_FILE"
          unset SERVER_SSH_KEY SERVER_SSH_KNOWN_HOSTS
          trap 'rm -f "$SERVER_SSH_KEY_FILE" "$SERVER_KNOWN_HOSTS_FILE"' EXIT
          flags=()
          if [[ "$APPLY" == true ]]; then flags+=(--apply); fi
          python3 -B shared/tools/promote_server.py \
            --run-id "$RUN_ID" --artifact-id "$ARTIFACT_ID" --source "$SOURCE" \
            --bundle "$RUNNER_TEMP/server-artifact.zip" \
            --work "$RUNNER_TEMP/server-candidate" \
            --evidence "$RUNNER_TEMP/server-promotion-evidence.json" \
            "${flags[@]}"
      - name: Retain bounded redacted promotion evidence
        if: always()
        # actions/upload-artifact v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-promotion-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/server-promotion-evidence.json
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 7 || 14 }}
