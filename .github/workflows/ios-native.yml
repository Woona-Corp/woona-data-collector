# yamllint disable rule:line-length
name: Canonical iOS native validation

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: full
      zip64-large:
        type: boolean
        default: true
      test-filter:
        type: string
        default: ''
      sanitizer:
        type: string
        default: none

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  native-build-unit:
    env:
      CI_PHASE_SCOPE: build-unit
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate mode and hermetic tooling tests
        env:
          MODE: ${{ inputs.mode }}
          FILTER: ${{ inputs.test-filter }}
          SANITIZER: ${{ inputs.sanitizer }}
          LARGE: ${{ inputs.zip64-large }}
        run: |
          python3 -m unittest discover -s ios/tools -p 'test_native_ci.py' -v
          python3 - <<'PY'
          import os
          mode = os.environ['MODE']
          assert mode in ('full', 'unit', 'diagnostic'), 'Invalid native mode'
          assert mode == 'diagnostic' or (not os.environ['FILTER'] and os.environ['SANITIZER'] == 'none'), 'Diagnostic inputs cannot authorize proof'
          PY
      - name: Verify pinned native host and start asynchronous simulator boot
        run: python3 ios/tools/native_ci.py prepare
      - name: Build both simulator test targets once, unsigned
        env:
          SANITIZER: ${{ inputs.sanitizer }}
          MODE: ${{ inputs.mode }}
        run: python3 ios/tools/native_ci.py build --mode "$MODE" --sanitizer "$SANITIZER"
      - name: Package transferable test products preserving modes and symlinks
        if: inputs.mode == 'full'
        run: python3 ios/tools/native_ci.py pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.mode == 'full'
        with:
          name: ios-test-products
          path: |
            ${{ runner.temp }}/woona-native-ci/products.tar
            ${{ runner.temp }}/woona-native-ci/products-manifest.json
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Independent archive SQLite/ZIP oracle
        env:
          WOONA_SKIP_ZIP64_LARGE: ${{ inputs.zip64-large && '0' || '1' }}
        run: python3 ios/tools/native_ci.py archive
      - name: Serial native units and independent session export proof
        env:
          MODE: ${{ inputs.mode }}
          FILTER: ${{ inputs.test-filter }}
          SANITIZER: ${{ inputs.sanitizer }}
        run: |
          # TEMPORARY diagnostic branch only. No retries or verdict substitution.
          root="$RUNNER_TEMP/woona-native-ci"
          simulator="$(cat "$root/simulator")"
          xcrun simctl spawn "$simulator" log stream --level debug --style compact \
            --predicate 'eventMessage CONTAINS "WOONA_CI_NAV"' > "$root/nav-unified-live.log" 2>&1 &
          log_pid=$!
          (
            # At most one 3-second sample, only after a heartbeat has been observed
            # and the stream has then gone quiet for >5 seconds while Woona lives.
            for attempt in $(seq 1 1200); do
              if grep -q 'event=heartbeat' "$root/nav-unified-live.log"; then
                modified=$(stat -f %m "$root/nav-unified-live.log")
                now=$(date +%s)
                if (( now - modified > 5 )); then
                  app_pid=$(pgrep -f '/Woona[.]app/Woona' | head -1 || true)
                  if [[ -n "$app_pid" ]]; then
                    python3 - "$app_pid" "$root/nav-main-thread-sample.txt" <<'PY'
          import subprocess, sys
          try:
              subprocess.run(['/usr/bin/sample', sys.argv[1], '3', '-file', sys.argv[2]], check=True, timeout=15)
          except (subprocess.SubprocessError, OSError) as error:
              print('WOONA_CI_NAV sample unavailable:', type(error).__name__, flush=True)
          PY
                    break
                  fi
                fi
              fi
              sleep 1
            done
          ) > "$root/nav-sample-monitor.log" 2>&1 &
          sample_pid=$!
          set +e
          python3 ios/tools/native_ci.py unit --mode "$MODE" --test-filter "$FILTER" --sanitizer "$SANITIZER"
          test_status=$?
          kill "$sample_pid" "$log_pid" 2>/dev/null
          wait "$sample_pid" "$log_pid" 2>/dev/null
          set -e
          exit "$test_status"
      - name: Always collect filtered navigation simulator logs (diagnostic only)
        if: always()
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'woona-native-ci'
          if (root / 'simulator').exists():
              with (root / 'nav-unified-final.log').open('w') as stream:
                  try:
                      subprocess.run(['xcrun', 'simctl', 'spawn', (root / 'simulator').read_text(),
                                      'log', 'show', '--last', '30m', '--style', 'compact',
                                      '--predicate', 'eventMessage CONTAINS "WOONA_CI_NAV"'],
                                     stdout=stream, stderr=subprocess.STDOUT, timeout=60, check=True)
                  except (subprocess.SubprocessError, OSError) as error:
                      stream.write('WOONA_CI_NAV log collection unavailable: ' + type(error).__name__ + '\n')
          PY
      - name: Retain complete result bundle with symlinks
        if: always()
        run: |
          cd "$RUNNER_TEMP/woona-native-ci"
          if test -d unit.xcresult; then tar -cf unit-xcresult.tar unit.xcresult; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ios-native-unit-evidence
          path: |
            ${{ runner.temp }}/woona-native-ci/*.json
            ${{ runner.temp }}/woona-native-ci/*.jsonl
            ${{ runner.temp }}/woona-native-ci/nav-*.log
            ${{ runner.temp }}/woona-native-ci/nav-*.txt
            ${{ runner.temp }}/woona-native-ci/*-xcresult.tar
            ${{ runner.temp }}/woona-native-ci/unit-attachments/
          retention-days: ${{ job.status == 'success' && 7 || 14 }}
          if-no-files-found: warn

  ui:
    needs: native-build-unit
    if: inputs.mode == 'full'
    env:
      CI_PHASE_SCOPE: ui-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify pinned host and start simulator boot before download
        run: python3 ios/tools/native_ci.py prepare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios-test-products
          path: ${{ runner.temp }}/woona-native-ci
      - name: Verify exact same-run product identity/hash and restore canonical path
        run: python3 ios/tools/native_ci.py verify
      - name: Serial explicit UI shard without rebuilding or retries
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 ios/tools/native_ci.py "ui-$SHARD"
      - name: Retain complete result bundle with symlinks
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cd "$RUNNER_TEMP/woona-native-ci"
          if test -d "ui-$SHARD.xcresult"; then tar -cf "ui-$SHARD-xcresult.tar" "ui-$SHARD.xcresult"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ios-native-ui-${{ matrix.shard }}-evidence
          path: |
            ${{ runner.temp }}/woona-native-ci/*.json
            ${{ runner.temp }}/woona-native-ci/*-xcresult.tar
            ${{ runner.temp }}/woona-native-ci/ui-${{ matrix.shard }}-attachments/
          retention-days: ${{ job.status == 'success' && 7 || 14 }}
          if-no-files-found: warn

  ios-required:
    needs: [native-build-unit, ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require selected job success, never skipped/failed proof
        env:
          MODE: ${{ inputs.mode }}
          UNIT: ${{ needs.native-build-unit.result }}
          UI: ${{ needs.ui.result }}
        run: |
          test "$UNIT" = success
          if test "$MODE" = full; then test "$UI" = success; else test "$UI" = skipped; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ios-native-*-evidence
          path: native-evidence
          merge-multiple: true
      - name: Exact identity completeness and independent export acceptance
        env:
          MODE: ${{ inputs.mode }}
        run: python3 ios/tools/native_ci.py aggregate --mode "$MODE" --directory native-evidence
      - name: Bind same-run evidence artifact IDs and service digests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > native-evidence/artifacts.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('native-evidence')
          names = ['ios-native-unit-evidence']
          if os.environ['MODE'] == 'full':
              names += ['ios-test-products', 'ios-native-ui-1-evidence', 'ios-native-ui-2-evidence']
          artifacts = json.loads((root / 'artifacts.json').read_text())['artifacts']
          bindings = []
          for name in names:
              matches = [a for a in artifacts if a['name'] == name and not a['expired']]
              assert len(matches) == 1, 'Missing/ambiguous same-run artifact: ' + name
              a = matches[0]
              bindings.append({k: a[k] for k in ('id', 'name', 'digest', 'size_in_bytes')})
          proof_path = root / 'native-proof.json'
          proof = json.loads(proof_path.read_text())
          proof['artifacts'] = bindings
          proof_path.write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ios-native-proof
          path: native-evidence/native-proof.json
          if-no-files-found: warn
          retention-days: ${{ job.status == 'success' && 7 || 14 }}
