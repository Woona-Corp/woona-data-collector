name: Mobile CI and releases

on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK
        run: ./android/tools/setup-android-sdk.sh
      - name: Test, lint, and build Android
        run: ./android/tools/check.sh fast
      - name: Prepare Android APK for release tag
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets
          [[ -n "$KEYSTORE_BASE64" && -n "$ANDROID_SIGNING_STORE_PASSWORD" && -n "$ANDROID_SIGNING_KEY_ALIAS" && -n "$ANDROID_SIGNING_KEY_PASSWORD" ]] || {
            echo 'Android signing secrets are required for a release tag' >&2
            exit 1
          }
          umask 077
          export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/woona-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
          (cd android && ./gradlew assembleRelease --no-daemon --console=plain)
          certs="$("$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)"
          grep -Fq 'cf308a3b4d025e871bf30225ce1d1c3499f0fcd9d557f8a8ac5f5c414b381fa2' <<< "$certs"
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/Woona-Android-release.apk
          (cd release-assets && sha256sum *.apk > SHA256SUMS-android.txt)
      - name: Prepare debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Woona-Android-debug.apk
          (cd release-assets && sha256sum *.apk > SHA256SUMS-android.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: release-assets/
          if-no-files-found: error

  ios:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Test iOS on simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')"
          xcodebuild -project ios/Woona.xcodeproj -scheme Woona -derivedDataPath "$RUNNER_TEMP/WoonaDerived" -resultBundlePath "$RUNNER_TEMP/WoonaTests.xcresult" -destination "platform=iOS Simulator,id=$simulator_id" CODE_SIGNING_ALLOWED=NO test || {
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/WoonaTests.xcresult" --compact
            exit 1
          }
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/WoonaTests.xcresult" --output-path "$RUNNER_TEMP/WoonaTestAttachments"
          python3 ios/tools/check-recording-export.py "$RUNNER_TEMP/WoonaTestAttachments"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-recording-export-proof
          path: ${{ runner.temp }}/WoonaTestAttachments/
          if-no-files-found: error
      - name: Collect iOS crash diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/WoonaFailure"
          xcrun xcresulttool export diagnostics --path "$RUNNER_TEMP/WoonaTests.xcresult" --output-path "$RUNNER_TEMP/WoonaFailure" || true
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'Woona*' -exec cp {} "$RUNNER_TEMP/WoonaFailure/" \; || true
          find "$RUNNER_TEMP/WoonaFailure" -type f -name '*.ips' -exec cat {} \;
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-failure-diagnostics
          path: ${{ runner.temp }}/WoonaFailure/
          if-no-files-found: warn

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shared
    env:
      WOONA_API_PORT: '18080'
      WOONA_STORAGE_ROOT_HOST: ../test-run/ci-storage
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose and backup
        run: |
          docker compose config -q
          bash server/tests/test_backup.sh
          bash operations/backups/test-scheduled-backup.sh
      - name: Test server and API
        run: |
          mkdir -p ../test-run/ci-storage
          chmod 777 ../test-run/ci-storage
          docker compose -p woona-ci up -d --build --wait
          docker compose -p woona-ci exec -T api python -m unittest discover -v -s server/tests
      - name: Clean up
        if: always()
        run: docker compose -p woona-ci down -v --remove-orphans

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: release-assets/
      - name: Publish tested builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Woona Android ${GITHUB_REF_NAME#android-v}"
          fi
