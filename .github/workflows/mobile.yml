name: Mobile CI and releases

on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        type: choice
        options: [all, android, ios, server]
        default: all
      export_server_image:
        description: Export verified server image privately for authorized exact-image deployment
        type: boolean
        default: false
      ios_test_filter:
        description: Optional XCTest target/class/method for a focused diagnostic run
        type: string
        default: ''
      android_instrumentation:
        description: Run Android SQLite, Compose and fake-BLE instrumentation tests
        type: boolean
        default: false
      sanitizer:
        description: Optional iOS unit-test diagnostics (Simulator only)
        type: choice
        options: [none, address, thread]
        default: none

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android: ${{ steps.select.outputs.android }}
      ios: ${{ steps.select.outputs.ios }}
      server: ${{ steps.select.outputs.server }}
      zip64_large: ${{ steps.select.outputs.zip64_large }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test CI selection policy
        run: python3 -m unittest discover -s .github/ci -p 'test_*.py' -v
      - name: Select dependency-aware checks
        id: select
        env:
          WOONA_CI_FETCH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/select_checks.py

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Install Android SDK
        env:
          ANDROID_INSTRUMENTATION: ${{ inputs.android_instrumentation }}
        run: |
          if [[ "$ANDROID_INSTRUMENTATION" == 'true' ]]; then
            ./android/tools/setup-android-sdk.sh full
          else
            ./android/tools/setup-android-sdk.sh fast
          fi
      - name: Enable KVM for Android instrumentation
        if: inputs.android_instrumentation == true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test, lint, and build Android
        env:
          ANDROID_INSTRUMENTATION: ${{ inputs.android_instrumentation }}
        run: |
          python3 android/tools/test_setup_android_sdk.py
          if [[ "$ANDROID_INSTRUMENTATION" == 'true' ]]; then
            ./android/tools/check.sh full
          else
            ./android/tools/check.sh fast
          fi
      - name: Preserve Android test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-test-diagnostics
          path: |
            android/app/build/test-results/
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/lint-results-debug.*
            android/app/build/outputs/apk/debug/
            android/app/build/outputs/apk/androidTest/debug/
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare Android APK for release tag
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets
          [[ -n "$KEYSTORE_BASE64" && -n "$ANDROID_SIGNING_STORE_PASSWORD" && -n "$ANDROID_SIGNING_KEY_ALIAS" && -n "$ANDROID_SIGNING_KEY_PASSWORD" ]] || {
            echo 'Android signing secrets are required for a release tag' >&2
            exit 1
          }
          umask 077
          export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/woona-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
          (cd android && ./gradlew assembleRelease --no-daemon --console=plain)
          certs="$("$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)"
          grep -Fq 'cf308a3b4d025e871bf30225ce1d1c3499f0fcd9d557f8a8ac5f5c414b381fa2' <<< "$certs"
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/Woona-Android-release.apk
          (cd release-assets && sha256sum *.apk > SHA256SUMS-android.txt)
      - name: Prepare debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Woona-Android-debug.apk
          (cd release-assets && sha256sum *.apk > SHA256SUMS-android.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-apk
          path: release-assets/
          if-no-files-found: error

  ios:
    needs: changes
    if: ${{ !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.ios == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify complete data archives with independent ZIP and SQLite readers
        env:
          # Only ordinary, non-storage CI opts out. Full/developer runs default on.
          WOONA_SKIP_ZIP64_LARGE: ${{ needs.changes.outputs.zip64_large == 'true' && '0' || '1' }}
        run: python3 ios/tools/test_complete_archive.py
      - name: Test iOS on simulator
        timeout-minutes: 30
        if: ${{ !cancelled() }}
        env:
          WOONA_SANITIZER: ${{ inputs.sanitizer || 'none' }}
          WOONA_IOS_TEST_FILTER: ${{ inputs.ios_test_filter }}
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')"
          xcrun simctl help bootstatus
          python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],check=True,timeout=180)' "$simulator_id"
          sanitizer_args=()
          filter_args=()
          parallel_args=(-parallel-testing-enabled NO)
          case "$WOONA_SANITIZER" in
            none) ;;
            address)
              sanitizer_args=(-enableAddressSanitizer YES -enableThreadSanitizer NO)
              filter_args=(-only-testing:WoonaTests)
              ;;
            thread)
              sanitizer_args=(-enableThreadSanitizer YES -enableAddressSanitizer NO)
              filter_args=(-only-testing:WoonaTests)
              parallel_args=(-parallel-testing-enabled NO)
              ;;
            *) echo 'Unsupported sanitizer mode' >&2; exit 2 ;;
          esac
          if [[ -n "$WOONA_IOS_TEST_FILTER" ]]; then
            [[ "$WOONA_IOS_TEST_FILTER" =~ ^Woona(Tests|UITests)(/[A-Za-z0-9_]+){0,2}$ ]] || { echo 'Invalid XCTest filter'; exit 2; }
            [[ "$WOONA_SANITIZER" == 'none' || "$WOONA_IOS_TEST_FILTER" != WoonaUITests* ]] || { echo 'Sanitizer filters must select unit tests'; exit 2; }
            filter_args=(-only-testing:"$WOONA_IOS_TEST_FILTER")
            parallel_args=(-parallel-testing-enabled NO)
          fi
          xcodebuild "${sanitizer_args[@]}" "${filter_args[@]}" "${parallel_args[@]}" -project ios/Woona.xcodeproj -scheme Woona -derivedDataPath "$RUNNER_TEMP/WoonaDerived" -resultBundlePath "$RUNNER_TEMP/WoonaTests.xcresult" -destination "platform=iOS Simulator,id=$simulator_id" CODE_SIGNING_ALLOWED=NO test || {
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/WoonaTests.xcresult" --compact
            exit 1
          }
      - name: Collect iOS test attachments
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/WoonaTests.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/WoonaTests.xcresult" --output-path "$RUNNER_TEMP/WoonaTestAttachments"
          fi
      - name: Verify session export attachments
        if: ${{ success() && inputs.ios_test_filter == '' && (inputs.sanitizer == '' || inputs.sanitizer == 'none') }}
        run: python3 ios/tools/check-recording-export.py "$RUNNER_TEMP/WoonaTestAttachments"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ios-recording-export-proof
          path: ${{ runner.temp }}/WoonaTestAttachments/
          if-no-files-found: warn
      - name: Collect iOS crash diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/WoonaFailure"
          xcrun xcresulttool export diagnostics --path "$RUNNER_TEMP/WoonaTests.xcresult" --output-path "$RUNNER_TEMP/WoonaFailure" || true
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'Woona*' -exec cp {} "$RUNNER_TEMP/WoonaFailure/" \; || true
          find "$RUNNER_TEMP/WoonaFailure" -type f -name '*.ips' -exec cat {} \;
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: ios-failure-diagnostics
          path: ${{ runner.temp }}/WoonaFailure/
          if-no-files-found: warn

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shared
    env:
      WOONA_API_PORT: '18080'
      WOONA_STORAGE_ROOT_HOST: ../test-run/ci-storage
      WOONA_BUILD_TARGET: verified
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Compose and disabled backup policy
        run: |
          python3 tools/check_questionnaire_presentation.py
          python3 server/check_dependency_lock.py
          python3 -B -m unittest -v server.tests.test_dependency_lock server.tests.test_deployment_provenance
          docker compose --env-file /dev/null config -q
          bash server/tests/test_backup.sh
          bash operations/backups/test-scheduled-backup.sh
      - name: Generate reviewed candidate source manifest
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          source_id="$(git rev-parse --verify HEAD)"
          echo "WOONA_SOURCE_ID=$source_id" >> "$GITHUB_ENV"
          mkdir -p build-provenance "$RUNNER_TEMP/server-provenance"
          git ls-files -z -- server docs/target-server-plan/models testdata |
            python3 -c 'import json,sys; print(json.dumps([p.decode("utf-8") for p in sys.stdin.buffer.read().split(b"\0") if p]))' > build-provenance/reviewed-inputs.json
          python3 -B server/deployment_provenance.py manifest --root . \
            --inputs build-provenance/reviewed-inputs.json --source-id "$source_id" \
            --schema-revision 0009 > build-provenance/source-manifest.json
          cp build-provenance/*.json "$RUNNER_TEMP/server-provenance/"
          cp compose.yaml compose.production.yaml compose.label.yaml server/Dockerfile "$RUNNER_TEMP/server-provenance/"
          # Keep explicit build rules visible to upload-artifact without enabling hidden-file uploads.
          cp .dockerignore "$RUNNER_TEMP/server-provenance/dockerignore.txt"
      - name: Build and verify immutable candidate image
        run: |
          docker compose -p woona-ci build api
          image_id="$(docker image inspect --format '{{.Id}}' woona-ci-api)"
          echo "WOONA_CANDIDATE_IMAGE=$image_id" >> "$GITHUB_ENV"
          # Override CMD: this probe never starts the API or runs migrations.
          docker run --rm --network none --entrypoint python "$image_id" -B -c '
          import json, os, sys
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from server.deployment_provenance import load_json, verify_tree
          assert ScriptDirectory.from_config(Config("/app/server/alembic.ini")).get_heads() == ["0009"]
          manifest = load_json("/app/deployment-source-manifest.json")
          uid = os.getuid()
          assert uid == 10001
          identity = verify_tree("/app", manifest, uid, sys.argv[1])
          print(json.dumps(dict(source_id=manifest["source_id"], manifest_sha256=identity,
                               schema_revision=manifest["schema_revision"], uid=uid)))
          ' "$WOONA_SOURCE_ID" > "$RUNNER_TEMP/server-provenance/tree-verification.json"
          python3 - "$image_id" "$RUNNER_TEMP/server-provenance" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[2])
          observed = json.loads((root / "tree-verification.json").read_text())
          observed["image_digest"] = sys.argv[1]  # actual Docker local configuration digest
          (root / "image-binding.json").write_text(json.dumps(observed, sort_keys=True) + "\n")
          PY
          python3 -B server/deployment_provenance.py compare \
            --manifest build-provenance/source-manifest.json \
            --observed "$RUNNER_TEMP/server-provenance/image-binding.json" \
            --expected-source-id "$WOONA_SOURCE_ID" --expected-image-digest "$image_id"
      - name: Test server and API
        run: |
          mkdir -p ../test-run/ci-storage
          chmod 777 ../test-run/ci-storage
          docker compose -p woona-ci up -d --no-build --wait
          test "$(docker inspect --format '{{.Image}}' "$(docker compose -p woona-ci ps -q api)")" = "$WOONA_CANDIDATE_IMAGE"
          docker compose -p woona-ci exec -T --user 0 api python -m pip install \
            --no-cache-dir --index-url https://pypi.org/simple --require-hashes --only-binary=:all: \
            -r /app/server/requirements-test.lock
          docker compose -p woona-ci exec -T api python -m pip check
          docker compose -p woona-ci exec -T api python -m unittest discover -v -s server/tests
      - name: Retain candidate provenance metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-image-provenance
          path: ${{ runner.temp }}/server-provenance/
          if-no-files-found: error
          retention-days: 7
      - name: Export exact verified server image (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.export_server_image == true && (inputs.scope == 'server' || inputs.scope == 'all')
        run: |
          mkdir -p "$RUNNER_TEMP/server-image"
          docker image save "$WOONA_CANDIDATE_IMAGE" -o "$RUNNER_TEMP/server-image/server-image.tar"
          cp "$RUNNER_TEMP/server-provenance/"*.json "$RUNNER_TEMP/server-image/"
          (cd "$RUNNER_TEMP/server-image" && sha256sum server-image.tar > SHA256SUMS)
      - name: Retain private exact-image export (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.export_server_image == true && (inputs.scope == 'server' || inputs.scope == 'all')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-verified-image
          path: ${{ runner.temp }}/server-image/
          if-no-files-found: error
          retention-days: 1
      - name: Clean up
        if: always()
        run: docker compose -p woona-ci down -v --remove-orphans

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: android-apk
          path: release-assets/
      - name: Publish tested builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_args=()
            if [[ "${GITHUB_REF_NAME#android-v}" == *-* ]]; then
              release_args=(--prerelease --latest=false)
            fi
            gh release create "${release_args[@]}" "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Woona Android ${GITHUB_REF_NAME#android-v}"
          fi
