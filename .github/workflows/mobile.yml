name: Mobile CI and releases

on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run
        type: choice
        options: [all, android, ios, server]
        default: all
      export_server_image:
        description: Export tested code-only image for authorized exact-image deployment
        type: boolean
        default: false
      ios_test_filter:
        description: Optional XCTest target/class/method for a focused diagnostic run
        type: string
        default: ''
      android_instrumentation:
        description: Run Android SQLite, Compose and fake-BLE instrumentation tests
        type: boolean
        default: false
      sanitizer:
        description: Optional iOS unit-test diagnostics (Simulator only)
        type: choice
        options: [none, address, thread]
        default: none

permissions:
  contents: read

# Closed PR runs share the ordinary group, cancelling stale work without native jobs.
concurrency:
  group: mobile-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v') && format('release-{0}', github.ref) || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android: ${{ steps.select.outputs.android }}
      ios: ${{ steps.select.outputs.ios }}
      server: ${{ steps.select.outputs.server }}
      zip64_large: ${{ steps.select.outputs.zip64_large }}
      android_full: ${{ steps.select.outputs.android_full }}
      android_mode: ${{ steps.select.outputs.android_mode }}
      android_release: ${{ steps.select.outputs.android_release }}
      ios_mode: ${{ steps.select.outputs.ios_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test CI selection policy
        run: python3 -m unittest discover -s .github/ci -p 'test_*.py' -v
      - name: Lightweight policy and documentation gate
        run: |
          git diff --check
          python3 shared/tools/check_questionnaire_presentation.py
          python3 android/tools/test_backup_policy.py
      - name: Select dependency-aware checks
        id: select
        env:
          WOONA_CI_FETCH_TOKEN: ${{ github.token }}
          CI_MAIN_UNITS_ENABLED: ${{ vars.CI_MAIN_UNITS_ENABLED }}
        run: python3 .github/ci/select_checks.py

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-disabled: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Install Android SDK
        env:
          ANDROID_INSTRUMENTATION: ${{ needs.changes.outputs.android_full }}
        run: |
          if [[ "$ANDROID_INSTRUMENTATION" == 'true' ]]; then
            ./android/tools/setup-android-sdk.sh full
          else
            ./android/tools/setup-android-sdk.sh fast
          fi
      - name: Enable KVM for Android instrumentation
        if: needs.changes.outputs.android_full == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record Android host baseline
        if: needs.changes.outputs.android_full == 'true'
        run: |
          diagnostics=android/app/build/outputs/androidTest-results/ci-health
          mkdir -p "$diagnostics"
          {
            date -u
            nproc
            free -m
            df -h / /dev/shm
            ls -l /dev/kvm
            timeout 15 "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
            ps -eo pid,ppid,comm,rss,pcpu --sort=-rss | head -n 25
          } > "$diagnostics/host-start.txt" 2>&1 || true
      - name: Test, lint, and build Android
        env:
          ANDROID_INSTRUMENTATION: ${{ needs.changes.outputs.android_full }}
        run: |
          python3 android/tools/test_setup_android_sdk.py
          python3 android/tools/test_backup_policy.py
          if [[ "$ANDROID_INSTRUMENTATION" == 'true' ]]; then
            ./android/tools/check.sh full
          else
            ./android/tools/check.sh fast
          fi
      - name: Verify Android JUnit identities before signing
        if: ${{ !cancelled() }}
        env:
          ANDROID_MODE: ${{ needs.changes.outputs.android_mode }}
        run: |
          python3 .github/ci/android_test_manifest.py \
            --mode "$ANDROID_MODE" --source "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --output android/app/build/ci-verification/android-tests.json
      - name: Record Android failure health
        if: failure() && needs.changes.outputs.android_full == 'true'
        run: |
          diagnostics=android/app/build/outputs/androidTest-results/ci-health
          mkdir -p "$diagnostics"
          {
            date -u
            free -m
            df -h / /dev/shm
            vmstat 1 3
            ps -eo pid,ppid,comm,rss,pcpu --sort=-rss | head -n 25
          } > "$diagnostics/host-failure.txt" 2>&1 || true
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          timeout 10 "$adb" devices > "$diagnostics/devices.txt" 2>&1 || true
          # Managed devices may already be stopped. Never target a physical
          # device or turn a failed test into a pass if collection is unavailable.
          serial="$(awk '$1 ~ /^emulator-[0-9]+$/ && $2 == "device" {print $1; exit}' "$diagnostics/devices.txt")"
          if [[ -n "$serial" ]]; then
            timeout 15 "$adb" -s "$serial" shell dumpsys meminfo 2>&1 | head -n 400 > "$diagnostics/emulator-memory.txt" || true
            timeout 15 "$adb" -s "$serial" shell dumpsys window windows 2>&1 | head -n 600 > "$diagnostics/emulator-windows.txt" || true
            timeout 15 "$adb" -s "$serial" shell ps -A 2>&1 | head -n 300 > "$diagnostics/emulator-processes.txt" || true
            timeout 15 "$adb" -s "$serial" shell dumpsys activity lastanr 2>&1 | head -n 300 > "$diagnostics/emulator-last-anr.txt" || true
            # Summary only: timestamps/tags include system_server ANR/watchdog
            # entries without exporting arbitrary DropBox entry contents.
            timeout 15 "$adb" -s "$serial" shell dumpsys dropbox 2>&1 | head -n 300 > "$diagnostics/emulator-dropbox-summary.txt" || true
            timeout 15 "$adb" -s "$serial" logcat -b all -d -t 3000 > "$diagnostics/emulator-logcat.txt" 2>&1 || true
          fi
      - name: Preserve Android test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-test-diagnostics
          path: |
            android/app/build/ci-verification/
            android/app/build/test-results/
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/managed_device_android_test_additional_output/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: ${{ job.status == 'failure' && 14 || 7 }}
      - name: Prepare Android APK for release tag
        if: github.event_name == 'push' && needs.changes.outputs.android_release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test '${{ needs.changes.outputs.android_full }}' = true
          mkdir -p release-assets
          [[ -n "$KEYSTORE_BASE64" && -n "$ANDROID_SIGNING_STORE_PASSWORD" && -n "$ANDROID_SIGNING_KEY_ALIAS" && -n "$ANDROID_SIGNING_KEY_PASSWORD" ]] || {
            echo 'Android signing secrets are required for a release tag' >&2
            exit 1
          }
          umask 077
          export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/woona-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
          trap 'rm -f "$ANDROID_SIGNING_STORE_FILE"' EXIT
          (cd android && ./gradlew assembleRelease --no-daemon --console=plain)
          expected_version="${GITHUB_REF_NAME#android-v}"
          actual_version="$("$ANDROID_SDK_ROOT/build-tools/36.1.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          test "$actual_version" = "$expected_version"
          grep -Eq 'WOONA_SERVER_TOKEN = "";' android/app/build/generated/source/buildConfig/release/com/example/myapplication/BuildConfig.java
          certs="$("$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)"
          grep -Fq 'cf308a3b4d025e871bf30225ce1d1c3499f0fcd9d557f8a8ac5f5c414b381fa2' <<< "$certs"
          test "$(stat -c %s android/app/build/outputs/apk/release/app-release.apk)" -le 23276117
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/Woona-Android-release.apk
          (cd release-assets && sha256sum *.apk > SHA256SUMS-android.txt)
      - name: Prepare debug APK
        if: needs.changes.outputs.android_release != 'true'
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Woona-Android-debug.apk
          (cd release-assets && sha256sum *.apk > SHA256SUMS-android.txt)
      - name: Bind Android test proof to APK artifact
        run: cp android/app/build/ci-verification/android-tests.json release-assets/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-apk
          retention-days: 7
          path: release-assets/
          if-no-files-found: error

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ios-native.yml
    with:
      mode: ${{ needs.changes.outputs.ios_mode }}
      zip64-large: ${{ needs.changes.outputs.zip64_large == 'true' }}
      test-filter: ${{ inputs.ios_test_filter || '' }}
      sanitizer: ${{ inputs.sanitizer || 'none' }}

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shared
    env:
      WOONA_API_PORT: '18080'
      WOONA_STORAGE_ROOT_HOST: ../test-run/ci-storage
      WOONA_BUILD_TARGET: verified
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Compose and disabled backup policy
        run: |
          python3 tools/check_questionnaire_presentation.py
          python3 server/check_dependency_lock.py
          python3 -B -m unittest -v server.tests.test_dependency_lock server.tests.test_deployment_provenance
          python3 -B -m unittest discover -s tools -p 'test_promote_server.py' -v
          docker compose --env-file /dev/null config -q
          bash server/tests/test_backup.sh
          bash operations/backups/test-scheduled-backup.sh
      - name: Generate reviewed candidate source manifest
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          source_id="$(git rev-parse --verify HEAD)"
          echo "WOONA_SOURCE_ID=$source_id" >> "$GITHUB_ENV"
          mkdir -p build-provenance "$RUNNER_TEMP/server-provenance"
          git ls-files -z -- server docs/target-server-plan/models testdata |
            python3 -c 'import json,sys; print(json.dumps([p.decode("utf-8") for p in sys.stdin.buffer.read().split(b"\0") if p]))' > build-provenance/reviewed-inputs.json
          python3 -B server/deployment_provenance.py manifest --root . \
            --inputs build-provenance/reviewed-inputs.json --source-id "$source_id" \
            --schema-revision 0009 > build-provenance/source-manifest.json
          cp build-provenance/*.json "$RUNNER_TEMP/server-provenance/"
          cp compose.yaml compose.production.yaml compose.label.yaml server/Dockerfile "$RUNNER_TEMP/server-provenance/"
          # Keep explicit build rules visible to upload-artifact without enabling hidden-file uploads.
          cp .dockerignore "$RUNNER_TEMP/server-provenance/dockerignore.txt"
      - name: Build and verify immutable candidate image
        run: |
          docker compose -p woona-ci build api
          image_id="$(docker image inspect --format '{{.Id}}' woona-ci-api)"
          echo "WOONA_CANDIDATE_IMAGE=$image_id" >> "$GITHUB_ENV"
          # Override CMD: this probe never starts the API or runs migrations.
          docker run --rm --network none --entrypoint python "$image_id" -B -c '
          import json, os, sys
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from server.deployment_provenance import load_json, verify_tree
          assert ScriptDirectory.from_config(Config("/app/server/alembic.ini")).get_heads() == ["0009"]
          manifest = load_json("/app/deployment-source-manifest.json")
          uid = os.getuid()
          assert uid == 10001
          identity = verify_tree("/app", manifest, uid, sys.argv[1])
          print(json.dumps(dict(source_id=manifest["source_id"], manifest_sha256=identity,
                               schema_revision=manifest["schema_revision"], uid=uid)))
          ' "$WOONA_SOURCE_ID" > "$RUNNER_TEMP/server-provenance/tree-verification.json"
          python3 - "$image_id" "$RUNNER_TEMP/server-provenance" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[2])
          observed = json.loads((root / "tree-verification.json").read_text())
          observed["image_digest"] = sys.argv[1]  # actual producer ID; promotion proves its OCI kind
          (root / "image-binding.json").write_text(json.dumps(observed, sort_keys=True) + "\n")
          PY
          python3 -B server/deployment_provenance.py compare \
            --manifest build-provenance/source-manifest.json \
            --observed "$RUNNER_TEMP/server-provenance/image-binding.json" \
            --expected-source-id "$WOONA_SOURCE_ID" --expected-image-digest "$image_id"
      - name: Test server and API
        run: |
          python3 --version
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          sha256sum "$(command -v ffmpeg)" "$(command -v ffprobe)"
          python3 -m unittest -v server.tests.test_video_normalization
          mkdir -p ../test-run/ci-storage
          chmod 777 ../test-run/ci-storage
          docker compose -p woona-ci up -d --no-build --wait
          test "$(docker inspect --format '{{.Image}}' "$(docker compose -p woona-ci ps -q api)")" = "$WOONA_CANDIDATE_IMAGE"
          docker compose -p woona-ci exec -T --user 0 api python -m pip install \
            --no-cache-dir --index-url https://pypi.org/simple --require-hashes --only-binary=:all: \
            -r /app/server/requirements-test.lock
          docker compose -p woona-ci exec -T api python -m pip check
          docker compose -p woona-ci exec -T api python -c '
          import sys, unittest
          print("Mandatory host media ran above; image excludes only test_video_normalization")
          def image_cases(suite):
              for case in suite:
                  if isinstance(case, unittest.TestSuite):
                      yield from image_cases(case)
                  elif case.__class__.__module__ != "test_video_normalization":
                      yield case
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(image_cases(unittest.defaultTestLoader.discover("server/tests"))))
          sys.exit(not result.wasSuccessful())
          '
      - name: Retain candidate provenance metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-image-provenance
          path: ${{ runner.temp }}/server-provenance/
          if-no-files-found: error
          retention-days: 7
      - name: Export exact verified server image (trusted main or explicit manual)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Woona-Corp/woona-data-collector') || (github.event_name == 'workflow_dispatch' && inputs.export_server_image == true && (inputs.scope == 'server' || inputs.scope == 'all'))
        run: |
          mkdir -p "$RUNNER_TEMP/server-image"
          docker image save "$WOONA_CANDIDATE_IMAGE" -o "$RUNNER_TEMP/server-image/server-image.tar"
          cp "$RUNNER_TEMP/server-provenance/"*.json "$RUNNER_TEMP/server-image/"
          (cd "$RUNNER_TEMP/server-image" && sha256sum server-image.tar > SHA256SUMS)
      - name: Retain code-only exact-image export (trusted main or explicit manual)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Woona-Corp/woona-data-collector') || (github.event_name == 'workflow_dispatch' && inputs.export_server_image == true && (inputs.scope == 'server' || inputs.scope == 'all'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-verified-image
          path: ${{ runner.temp }}/server-image/
          if-no-files-found: error
          retention-days: 7
      - name: Clean up
        if: always()
        run: docker compose -p woona-ci down -v --remove-orphans

  release:
    if: github.event_name == 'push' && needs.changes.outputs.android_release == 'true'
    needs: [changes, android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: android-apk
          path: release-assets/
      - name: Publish tested builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-assets && sha256sum -c SHA256SUMS-android.txt)
          test -f release-assets/Woona-Android-release.apk
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; immutable assets cannot be replaced" >&2
            exit 1
          else
            release_args=()
            if [[ "${GITHUB_REF_NAME#android-v}" == *-* ]]; then
              release_args=(--prerelease --latest=false)
            fi
            gh release create "${release_args[@]}" "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Woona Android ${GITHUB_REF_NAME#android-v}"
          fi

  ci-required:
    if: always()
    needs: [changes, android, ios, server, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/ci/select_checks.py --required-gate
