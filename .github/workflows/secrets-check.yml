name: Verify mobile and server secrets
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      WOONA_PRODUCTION_POSTGRES_PASSWORD: ${{ secrets.WOONA_PRODUCTION_POSTGRES_PASSWORD }}
      WOONA_PRODUCTION_LEGACY_DEVICE_TOKEN: ${{ secrets.WOONA_PRODUCTION_LEGACY_DEVICE_TOKEN }}
      LABEL_DB_PASSWORD: ${{ secrets.LABEL_DB_PASSWORD }}
      LABEL_ADMIN_PASSWORD: ${{ secrets.LABEL_ADMIN_PASSWORD }}
      LABEL_API_TOKEN: ${{ secrets.LABEL_API_TOKEN }}
      LABEL_DJANGO_SECRET_KEY: ${{ secrets.LABEL_DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate secret availability and signing material without printing values
        run: |
          python3 - <<'PY'
          import base64, os, subprocess, tempfile
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_SIGNING_KEY_ALIAS',
                   'ANDROID_SIGNING_KEY_PASSWORD', 'ANDROID_SIGNING_STORE_PASSWORD',
                   'ASC_ISSUER_ID', 'ASC_KEY_ID', 'ASC_PRIVATE_KEY',
                   'BUILD_CERTIFICATE_BASE64', 'BUILD_PROVISION_PROFILE_BASE64',
                   'KEYCHAIN_PASSWORD', 'P12_PASSWORD', 'WOONA_PRODUCTION_POSTGRES_PASSWORD',
                   'WOONA_PRODUCTION_LEGACY_DEVICE_TOKEN', 'LABEL_DB_PASSWORD',
                   'LABEL_ADMIN_PASSWORD', 'LABEL_API_TOKEN', 'LABEL_DJANGO_SECRET_KEY']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Required mobile/server secret is missing')
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              for name in ['ANDROID_KEYSTORE_BASE64', 'BUILD_CERTIFICATE_BASE64', 'BUILD_PROVISION_PROFILE_BASE64']:
                  try:
                      value = base64.b64decode(os.environ[name])
                  except Exception:
                      raise SystemExit('Signing material is not valid base64') from None
                  if not value:
                      raise SystemExit('Signing material is empty')
                  target = root / name
                  target.write_bytes(value)
                  target.chmod(0o600)
              key = root / 'asc.p8'
              key.write_text(os.environ['ASC_PRIVATE_KEY'])
              key.chmod(0o600)
              result = subprocess.run(['openssl', 'pkey', '-in', str(key), '-check', '-noout'], capture_output=True)
              if result.returncode:
                  raise SystemExit('App Store Connect private key validation failed; values redacted')
              checker = root / 'CheckStore.java'
              checker.write_text('''import java.nio.file.*; import java.io.*; import java.security.*;
          class CheckStore { public static void main(String[] args) throws Exception {
            KeyStore store = KeyStore.getInstance(new File(args[0]), System.getenv("ANDROID_SIGNING_STORE_PASSWORD").toCharArray());
            if (store.getKey(System.getenv("ANDROID_SIGNING_KEY_ALIAS"), System.getenv("ANDROID_SIGNING_KEY_PASSWORD").toCharArray()) == null) throw new Exception("Missing signing key");
          }}''')
              result = subprocess.run(['java', str(checker), str(root / 'ANDROID_KEYSTORE_BASE64')], capture_output=True)
              if result.returncode:
                  raise SystemExit('Android signing key/password validation failed; values redacted')
          print('All 17 mobile/server secrets are available; Android signing key and ASC private key validated.')
          PY
