# yamllint disable rule:line-length
name: Upload iOS to TestFlight

on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight-main
  cancel-in-progress: false
  queue: max

jobs:
  native:
    uses: ./.github/workflows/ios-native.yml
    with:
      mode: full
      zip64-large: true

  testflight:
    needs: native
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios-native-proof
      - name: Verify exact full native proof before any signing assets
        run: |
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.5'
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          proof = json.loads(Path('native-proof.json').read_text())
          assert proof['mode'] == 'full' and proof['fullproof'] is True
          assert proof['zip64_large'] is True and proof['independent_export_verified'] is True
          identity = proof['identity']
          assert (identity['source'], identity['run'], identity['attempt']) == (os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'])
          assert identity['xcode'] == subprocess.check_output(['xcodebuild', '-version'], text=True).strip()
          assert identity['architecture'] == platform.machine() == 'arm64'
          PY
      - name: Verify tag and Release marketing version before signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          settings = json.loads(subprocess.check_output([
              'xcodebuild', '-showBuildSettings', '-json', '-project', 'ios/Woona.xcodeproj',
              '-scheme', 'Woona', '-configuration', 'Release', 'CODE_SIGNING_ALLOWED=NO'], text=True))
          app = [s['buildSettings'] for s in settings if s['target'] == 'Woona']
          assert len(app) == 1, 'Ambiguous Release application settings'
          version = app[0]['MARKETING_VERSION']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Invalid marketing version'
          if os.environ['EVENT_NAME'] == 'push':
              tag = os.environ['TAG_NAME']
              assert tag.startswith('ios-v') and tag[5:].split('-', 1)[0] == version, 'Tag/version mismatch'
          PY
      - name: Install distribution signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${BUILD_CERTIFICATE_BASE64:?Missing BUILD_CERTIFICATE_BASE64 secret}"
          : "${BUILD_PROVISION_PROFILE_BASE64:?Missing BUILD_PROVISION_PROFILE_BASE64 secret}"
          : "${P12_PASSWORD:?Missing P12_PASSWORD secret}"
          : "${KEYCHAIN_PASSWORD:?Missing KEYCHAIN_PASSWORD secret}"
          umask 077
          certificate_path="$RUNNER_TEMP/woona-distribution.p12"
          profile_path="$RUNNER_TEMP/woona-app-store.mobileprovision"
          keychain_path="$RUNNER_TEMP/woona-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$profile_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/woona-app-store.mobileprovision"
      - name: Archive and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_ID:?Missing ASC_KEY_ID secret}"
          : "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID secret}"
          : "${ASC_PRIVATE_KEY:?Missing ASC_PRIVATE_KEY secret}"
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          trap 'rm -f "$key_path"' EXIT
          build_number=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "Building Woona $build_number"
          if [[ "$UPLOAD" == 'true' ]]; then destination=upload; else destination=export; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>DESTINATION</string>
            <key>signingStyle</key><string>manual</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.woona.apps</key><string>Woona CI App Store Connect</string>
            </dict>
            <key>teamID</key><string>NBM28T989D</string>
          </dict></plist>
          PLIST
          sed -i '' "s/DESTINATION/$destination/" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -project ios/Woona.xcodeproj -scheme Woona -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Woona.xcarchive" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER='Woona CI App Store Connect' DEVELOPMENT_TEAM=NBM28T989D CURRENT_PROJECT_VERSION="$build_number" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Woona.xcarchive" -exportPath "$RUNNER_TEMP/WoonaExport" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates -authenticationKeyPath "$key_path" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          export BUILD_NUMBER="$build_number"
          python3 - <<'PY'
          import hashlib, json, os, plistlib
          from pathlib import Path
          archive = Path(os.environ['RUNNER_TEMP']) / 'Woona.xcarchive'
          info = plistlib.loads((archive / 'Products/Applications/Woona.app/Info.plist').read_bytes())
          assert str(info['CFBundleVersion']) == os.environ['BUILD_NUMBER']
          manifest = {
              'source': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'version': info['CFBundleShortVersionString'], 'build': str(info['CFBundleVersion']),
              'uploaded': os.environ['UPLOAD'] == 'true',
              'native_proof_sha256': hashlib.sha256(Path('native-proof.json').read_bytes()).hexdigest(),
          }
          Path('testflight-upload.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: testflight-upload-manifest
          path: testflight-upload.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/woona-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/woona-distribution.p12" "$RUNNER_TEMP/woona-app-store.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/woona-app-store.mobileprovision"

  apple-status:
    needs: testflight
    if: github.event_name == 'push' || inputs.upload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: testflight-upload-manifest
      - name: Observe exact uploaded build read-only (not tester availability)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          m = json.loads(Path('testflight-upload.json').read_text())
          assert m['uploaded'] is True
          assert (m['source'], m['run'], m['attempt']) == (os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'])
          subprocess.run(['python3', 'ios/tools/testflight_internal.py'], check=True,
                         env={**os.environ, 'CHECK_VERSION': m['version'], 'CHECK_BUILD': m['build'],
                              'ASSIGN_INTERNAL': 'false', 'INTERNAL_GROUP_IDS': ''})
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: testflight-processing-status
          path: |
            testflight-upload.json
            testflight-internal-status.json
            testflight-internal-polls.jsonl
          retention-days: ${{ job.status == 'success' && 7 || 14 }}
