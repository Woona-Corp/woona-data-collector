name: Verify TestFlight tester access (read-only)
on:
  workflow_dispatch:
    inputs:
      target_email_sha256:
        required: true
        type: string
      target_name_sha256:
        required: false
        type: string
        default: ''
      version:
        required: true
        type: string
        default: '1.4.0'
      build:
        required: true
        type: string
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check Apple build and groups
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          CHECK_VERSION: ${{ inputs.version }}
          CHECK_BUILD: ${{ inputs.build }}
          TARGET_EMAIL_SHA256: ${{ inputs.target_email_sha256 }}
          TARGET_NAME_SHA256: ${{ inputs.target_name_sha256 }}
        run: |
          python3 ios/tools/check_testflight_status.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testflight-status
          path: |
            testflight-status.json
          if-no-files-found: error
