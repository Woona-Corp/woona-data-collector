name: Verify TestFlight distribution
on:
  workflow_dispatch:
    inputs:
      upload:
        type: boolean
        default: false
      build:
        type: string
        default: '11901'
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check Apple build and groups
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          CHECK_VERSION: '1.3.9'
          CHECK_BUILD: ${{ inputs.build }}
          DISTRIBUTE: ${{ inputs.upload }}
        run: |
          python3 ios/tools/check_testflight_status.py
          python3 ios/tools/distribute_testflight.py
      - uses: actions/upload-artifact@v7
        with:
          name: testflight-status
          path: |
            testflight-status.json
            testflight-distribution.json
          if-no-files-found: error
