services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-woona}
      POSTGRES_USER: ${POSTGRES_USER:-woona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-woona-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-woona} -d ${POSTGRES_DB:-woona}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ${WOONA_POSTGRES_ROOT:-postgres_data}:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-woona}:${POSTGRES_PASSWORD:-woona-local-only}@postgres:5432/${POSTGRES_DB:-woona}
      WOONA_STORAGE_ROOT: /srv/woona
      WOONA_DEVICE_ID: ${WOONA_DEVICE_ID:-00000000-0000-0000-0000-000000000001}
      WOONA_DEVICE_LABEL: ${WOONA_DEVICE_LABEL:-Local device}
      WOONA_DEBUG_TOKEN: ${WOONA_DEBUG_TOKEN:-change-me-local-token}
      WOONA_ENVIRONMENT: ${WOONA_ENVIRONMENT:-development}
      WOONA_UPLOAD_FREE_SPACE_RESERVE_BYTES: ${WOONA_UPLOAD_FREE_SPACE_RESERVE_BYTES:-268435456}
      WOONA_RECORDING_QUOTA_BYTES: ${WOONA_RECORDING_QUOTA_BYTES:-21474836480}
      WOONA_ACCOUNT_QUOTA_BYTES: ${WOONA_ACCOUNT_QUOTA_BYTES:-107374182400}
      WOONA_INTEGRITY_MAX_ARTIFACTS: ${WOONA_INTEGRITY_MAX_ARTIFACTS:-50}
      WOONA_INTEGRITY_MAX_FILE_BYTES: ${WOONA_INTEGRITY_MAX_FILE_BYTES:-16777216}
      WOONA_INTEGRITY_MAX_HASH_BYTES: ${WOONA_INTEGRITY_MAX_HASH_BYTES:-33554432}
      WOONA_INTEGRITY_MAX_SECONDS: ${WOONA_INTEGRITY_MAX_SECONDS:-2}
      WOONA_INTEGRITY_MIN_INTERVAL_SECONDS: ${WOONA_INTEGRITY_MIN_INTERVAL_SECONDS:-1}
      WOONA_ALLOW_LEGACY_MIGRATION: ${WOONA_ALLOW_LEGACY_MIGRATION:-true}
      WOONA_SCHEMA_PATH: /app/docs/target-server-plan/models/postgresql.sql
      WOONA_DOG_SCHEMA_PATH: /app/docs/target-server-plan/models/dog-questionnaire.schema.json
      WOONA_SESSION_SCHEMA_PATH: /app/docs/target-server-plan/models/session-questionnaire.schema.json
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WOONA_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ${WOONA_STORAGE_ROOT_HOST:-../var/storage}:/srv/woona

volumes:
  postgres_data:
