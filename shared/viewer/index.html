<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Woona Signal Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Woona Signal Viewer</h1>
        <p>Read-only sensor recordings from the server</p>
      </div>
      <div id="status" class="status" aria-live="polite">Loading recordings…</div>
    </header>
    <section class="controls panel">
      <label class="recording-picker"><span>Recording</span><select id="recordingSelect" disabled></select></label>
      <button id="openButton" type="button" disabled>Open</button>
      <button id="resetButton" type="button" disabled>Reset zoom</button>
      <button id="last10Button" type="button" disabled>Last 10 s</button>
      <button id="last30Button" type="button" disabled>Last 30 s</button>
      <button id="allButton" type="button" disabled>All</button>
    </section>
    <section id="recordingInfo" class="info panel hidden"></section>
    <section id="streamPanel" class="panel hidden">
      <div class="section-title">Signals</div>
      <div id="streamList" class="stream-list"></div>
    </section>
    <section class="chart-panel panel">
      <div class="chart-help">Wheel: zoom · drag: pan · double-click: reset · hover: synchronized cursor</div>
      <div id="emptyState" class="empty-state">Select a recording to inspect sensor data.</div>
      <canvas id="chart" class="chart hidden" aria-label="Sensor signal plots"></canvas>
      <div id="cursorReadout" class="cursor-readout hidden"></div>
    </section>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
